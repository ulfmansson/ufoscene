name: ufo
description: UFO demo website — private S3 bucket behind CloudFront, optional custom domain
runtime:
  name: nodejs
  options:
    packagemanager: npm
# Settings (pulumi config set <key> <value>), all optional:
#   ufo:domain            custom domain such as ufoscene.net (unset = only the *.cloudfront.net address)
#   ufo:route53           true: DNS is in Route 53; the public hosted zone named ufo:domain is looked
#                         up, and certificate validation and A/AAAA alias records are created in it
#                         (a domain registered in Route 53 has that zone already)
#   ufo:hostedZoneId      instead of ufo:route53: the zone ID itself (without /hostedzone/)
#   ufo:createZone        instead of the two above: Pulumi creates the domain's hosted zone
#                         (`../deploy.sh <stack> --domain <name>` picks this or ufo:route53 for you)
#   ufo:fixNameServers    true: the domain is registered in Route 53 in this account; Pulumi sets the
#                         registration's name servers to the zone's (it never buys or deletes the domain)
#   ufo:www               also serve www.<domain>, 301 to the bare domain (default true)
#   ufo:certificateReady  true once the certificate can validate: without a Route 53 zone, when its
#                         validation CNAMEs are in your DNS and ACM shows it issued; with ufo:createZone
#                         at another registrar, when that registrar uses the zone's name servers
#   ufo:maxAge            seconds browsers and CloudFront may keep a file (default 60; names are not hashed)
#   ufo:priceClass        CloudFront price class (default PriceClass_100 = Europe + North America)
