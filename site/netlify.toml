# Netlify alternative (only needed if you pick Netlify over Cloudflare).
#   cd site && npx netlify-cli deploy --prod --dir dist
[build]
  publish = "dist"

# Spotify sends the browser back to /callback: serve the page there.
[[redirects]]
  from = "/callback"
  to = "/index.html"
  status = 200

# A show's own address (ufoscene.net/kite, /queen, /concert, /ukraine) is the page too.
[[redirects]]
  from = "/kite"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/queen"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/concert"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ukraine"
  to = "/index.html"
  status = 200
